openapi: 3.1.0
info:
  title: IncuBrix B-roll Engine
  version: 0.4.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/broll/jobs:
    post:
      summary: Create
      operationId: create_api_v1_broll_jobs_post
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs/upload:
    post:
      summary: Create Upload
      operationId: create_upload_api_v1_broll_jobs_upload_post
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_upload_api_v1_broll_jobs_upload_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      summary: Job Status
      operationId: job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/files/{name}:
    get:
      summary: Job File
      operationId: job_file_api_v1_jobs__job_id__files__name__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_create_upload_api_v1_broll_jobs_upload_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
        aspect_ratios:
          type: string
          title: Aspect Ratios
          default: '16:9'
        style:
          type: string
          title: Style
          default: bright, modern, real-world footage
        avoid:
          type: string
          title: Avoid
          default: ''
        burn_in:
          type: boolean
          title: Burn In
          default: true
      type: object
      required:
      - audio
      title: Body_create_upload_api_v1_broll_jobs_upload_post
    Captions:
      properties:
        burn_in:
          type: boolean
          title: Burn In
          default: true
        srt:
          type: boolean
          title: Srt
          default: true
      type: object
      title: Captions
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobRequest:
      properties:
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
        script:
          anyOf:
          - type: string
          - type: 'null'
          title: Script
        scenes:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Scenes
        voice:
          type: string
          title: Voice
          default: en-US
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
          default:
          - '16:9'
        style:
          type: string
          title: Style
          default: bright, modern, real-world footage
        avoid:
          items:
            type: string
          type: array
          title: Avoid
          default: []
        captions:
          $ref: '#/components/schemas/Captions'
          default:
            burn_in: true
            srt: true
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: JobRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
